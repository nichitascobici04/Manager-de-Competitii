<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Patterns Demo UI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Patterns Demo</a>
    </div>
  </nav>

  <main class="container">
    <div class="row">
      <aside class="col-md-4">
        <div class="list-group mb-3" id="patternList">
          <button class="list-group-item list-group-item-action active" data-section="creational">Creational</button>
          <button class="list-group-item list-group-item-action" data-section="structural">Structural</button>
          <button class="list-group-item list-group-item-action" data-section="behavioral">Behavioral</button>
        </div>

        <div class="card p-3 mb-3">
          <h6>Server base URL</h6>
          <input id="baseUrl" class="form-control" value="/api/Patterns" />
        </div>
      </aside>

      <section class="col-md-8">
        <div id="creational" class="pattern-section">
          <h4>Creational Patterns</h4>

          <div class="mb-3">
            <label class="form-label">Abstract Factory - Configure Tournament</label>
            <div class="input-group">
              <input id="abstract_tournamentType" class="form-control" placeholder="e.g. RoundRobin" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('abstractfactory/configure', { tournamentType: document.getElementById('abstract_tournamentType').value })">Run</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Factory Method - Generate Rounds</label>
            <div class="input-group">
              <input id="factory_roundsType" class="form-control" placeholder="e.g. Group" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('factorymethod/generate', { roundsType: document.getElementById('factory_roundsType').value })">Run</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Builder - Build Competition</label>
            <div class="input-group">
              <input id="builder_name" class="form-control" placeholder="Competition name" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('builder/build', { name: document.getElementById('builder_name').value })">Run</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Simple Factory - Create Participant</label>
            <div class="input-group">
              <input id="simple_kind" class="form-control" placeholder="kind (User/Guest/Participant)" />
              <input id="simple_name" class="form-control" placeholder="name" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('simplefactory/create-participant', { kind: document.getElementById('simple_kind').value, name: document.getElementById('simple_name').value })">Run</button>
            </div>
          </div>
        </div>

        <div id="structural" class="pattern-section d-none">
          <h4>Structural Patterns</h4>

          <div class="mb-3">
            <label class="form-label">Flyweight - Get Venue</label>
            <div class="input-group">
              <input id="flyweight_key" class="form-control" placeholder="venue key" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('flyweight/venue', { venueKey: document.getElementById('flyweight_key').value })">Run</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Proxy - Start Competition</label>
            <div class="input-group">
              <input id="proxy_competitionId" type="number" class="form-control" placeholder="competition id" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('proxy/start', { competitionId: document.getElementById('proxy_competitionId').value })">Run</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Bridge - Send Notification</label>
            <div class="input-group">
              <input id="bridge_channel" class="form-control" placeholder="channel (Email/SMS)" />
              <input id="bridge_message" class="form-control" placeholder="message" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('bridge/notify', { channel: document.getElementById('bridge_channel').value, message: document.getElementById('bridge_message').value })">Run</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Facade - Start Competition</label>
            <div class="input-group">
              <input id="facade_organizerId" type="number" class="form-control" placeholder="organizer id" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('facade/start', { organizerId: document.getElementById('facade_organizerId').value })">Run</button>
            </div>
          </div>
        </div>

        <div id="behavioral" class="pattern-section d-none">
          <h4>Behavioral Patterns</h4>

          <div class="mb-3">
            <label class="form-label">Iterator - Iterate Matches</label>
            <div class="input-group">
              <input id="iterator_competitionId" type="number" class="form-control" placeholder="competition id" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('iterator/iterate-matches', { competitionId: document.getElementById('iterator_competitionId').value })">Run</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Observer - Subscribe Live Match</label>
            <div class="input-group">
              <input id="observer_matchId" type="number" class="form-control" placeholder="match id" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('observer/subscribe', { matchId: document.getElementById('observer_matchId').value })">Run</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Command - Execute Command</label>
            <div class="input-group">
              <input id="command_name" class="form-control" placeholder="command name" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('command/execute', { commandName: document.getElementById('command_name').value })">Run</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Strategy - Apply Strategy</label>
            <div class="input-group">
              <input id="strategy_name" class="form-control" placeholder="strategy name" />
              <button class="btn btn-outline-primary" onclick="callEndpoint('strategy/apply', { strategyName: document.getElementById('strategy_name').value })">Run</button>
            </div>
          </div>
        </div>

        <div class="card mt-4">
          <div class="card-header">Response</div>
          <div class="card-body">
            <pre id="response" class="small mb-0">No requests yet.</pre>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/patterns.js"></script>
</body>
</html>
